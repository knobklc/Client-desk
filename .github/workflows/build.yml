name: Build APK
on:
  workflow_dispatch: {}
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21 }
      - run: unzip -q "$(ls *.zip | head -1)"
      - run: npm install
        working-directory: clientdesk
      - run: npm run build:web
        working-directory: clientdesk
      - run: npx cap add android
        working-directory: clientdesk
      - run: npx capacitor-assets generate --android
        working-directory: clientdesk
      - run: npx cap sync android
        working-directory: clientdesk
      - run: node scripts/patch-android.js
        working-directory: clientdesk
      - run: ./gradlew assembleDebug
        working-directory: clientdesk/android
      - uses: actions/upload-artifact@v4
        with:
          name: ClientDesk-debug-apk
          path: clientdesk/android/app/build/outputs/apk/debug/app-debug.apk
